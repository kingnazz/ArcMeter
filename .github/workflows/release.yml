name: Release ArcMeter

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            bundles: nsis
          - platform: macos-15
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Require a matching release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match ArcMeter v$version" }
      - name: Require release credentials
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.ARCMETER_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.ARCMETER_SUPABASE_ANON_KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_KEY)) { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PASSWORD)) { $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) { $missing += "ARCMETER_SUPABASE_URL" }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_KEY)) { $missing += "ARCMETER_SUPABASE_ANON_KEY" }
          if ($missing.Count -gt 0) { throw "Missing required repository secrets: $($missing -join ', ')" }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARCMETER_SUPABASE_URL: ${{ secrets.ARCMETER_SUPABASE_URL }}
          ARCMETER_SUPABASE_ANON_KEY: ${{ secrets.ARCMETER_SUPABASE_ANON_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: ArcMeter v__VERSION__
          releaseBody: Signed Windows and macOS installers plus the ArcMeter in-app update manifest.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
