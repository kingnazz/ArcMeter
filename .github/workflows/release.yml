name: Release ArcMeter

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            bundles: nsis
            targetArgs: ""
            rustTargets: ""
            macArch: ""
            appleSigningIdentity: ""
          - platform: macos-15
            bundles: app,dmg
            targetArgs: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin
            macArch: arm64
            appleSigningIdentity: "-"
          - platform: macos-15
            bundles: app,dmg
            targetArgs: --target x86_64-apple-darwin
            rustTargets: x86_64-apple-darwin
            macArch: x86_64
            appleSigningIdentity: "-"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}
      - run: pnpm install --frozen-lockfile
      - name: Require release credentials
        shell: pwsh
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.ARCMETER_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.ARCMETER_SUPABASE_ANON_KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_KEY)) { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PASSWORD)) { $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) { $missing += "ARCMETER_SUPABASE_URL" }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_KEY)) { $missing += "ARCMETER_SUPABASE_ANON_KEY" }
          if ($missing.Count -gt 0) { throw "Missing required repository secrets: $($missing -join ', ')" }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing is separate from Apple bundle code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.appleSigningIdentity }}
          ARCMETER_SUPABASE_URL: ${{ secrets.ARCMETER_SUPABASE_URL }}
          ARCMETER_SUPABASE_ANON_KEY: ${{ secrets.ARCMETER_SUPABASE_ANON_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: ArcMeter v__VERSION__
          releaseBody: Windows installer and ad-hoc signed personal-use macOS installers, plus the signed ArcMeter updater manifest. The macOS apps are not Apple Developer ID signed or notarized.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.targetArgs }}
      - name: Verify final macOS DMG bundle signature and architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(apps/desktop/src-tauri/target/${{ matrix.rustTargets }}/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "expected exactly one DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi
          scripts/verify-macos-dmg.sh "${dmgs[0]}" "${{ matrix.macArch }}"
